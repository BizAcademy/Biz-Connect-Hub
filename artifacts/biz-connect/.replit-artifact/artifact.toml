kind = "web"
previewPath = "/"
title = "Biz Connect Academy"
description = "Landing page marketing complète pour Biz Connect Academy — réseau d'affiliation à 3 niveaux en Afrique francophone. Inclut toutes les sections marketing, un widget de notifications, un formulaire de leads, et un panneau admin protégé par mot de passe."
version = "1.0.0"
id = "artifacts/biz-connect"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19698

[services.development]
run = "pnpm --filter @workspace/biz-connect run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/biz-connect", "run", "build" ]
serve = "static"
publicDir = "artifacts/biz-connect/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19698"
BASE_PATH = "/"
